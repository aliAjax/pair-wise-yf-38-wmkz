<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>基因组数据访问治理</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 2rem; color: #1f2937; }
    main { max-width: 820px; margin: auto; }
    pre { background: #f3f4f6; padding: 1rem; border-radius: 8px; overflow-x: auto; }
    button { padding: .5rem .8rem; cursor: pointer; }
  </style>
</head>
<body>
<main>
  <h1>基因组数据访问治理</h1>
  <p>这是最小演示页面。使用浏览器或 curl 调用 JSON API。</p>
  <p><button onclick="checkHealth()">检查服务状态</button></p>
  <pre id="result">等待操作</pre>
  <h2>常用接口</h2>
  <pre>GET  /health
GET  /api/&lt;kind&gt;
POST /api/&lt;kind&gt;
GET  /api/entities/&lt;id&gt;
POST /api/entities/&lt;id&gt;/actions</pre>
  <h2>凭证续期与冻结记录</h2>
  <p><button onclick="loadGrants()">加载凭证记录</button></p>
  <pre id="grants">尚未加载</pre>
</main>
<script>
async function checkHealth() {
  const response = await fetch('/health');
  document.getElementById('result').textContent = JSON.stringify(await response.json(), null, 2);
}

async function loadGrants() {
  const response = await fetch('/api/grants');
  const payload = await response.json();
  const lines = [];
  for (const grant of payload.items) {
    lines.push('凭证 ' + grant.id + ' [' + grant.status + '] 有效期至 ' + (grant.data.expires_at || '-'));
    lines.push('  续期记录:');
    for (const item of grant.data.renewals || []) {
      lines.push('    ' + item.from + ' -> ' + item.to + ' [' + item.status + '] 申请人 ' + item.requested_by + (item.decided_by ? ' 审批人 ' + item.decided_by : ''));
    }
    lines.push('  冻结记录:');
    for (const item of grant.data.freezes || []) {
      lines.push('    ' + item.event + ' @ ' + item.at + ' 操作人 ' + item.by + (item.reason ? ' 原因 ' + item.reason : ''));
    }
    lines.push('');
  }
  document.getElementById('grants').textContent = lines.join('\n') || '暂无凭证';
}
</script>
</body>
</html>
